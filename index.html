<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Graph Data Preview</title>
    <meta name="description" content="Fetch and preview Open Graph and Twitter Card metadata for any URL. No API key needed.">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 py-8 px-4">
    <div class="max-w-2xl mx-auto bg-white p-6 rounded-md shadow-md">
        <h1 class="text-2xl font-bold mb-4">Open Graph Data Preview</h1>
        <form id="urlForm" class="flex flex-col sm:flex-row gap-2">
            <label for="url" class="sr-only">URL</label>
            <input type="text" id="url" name="url" placeholder="example.com/some-page" autocomplete="url"
                   class="flex-1 border border-gray-300 rounded-md p-2" required>
            <button type="submit" id="submitBtn" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-md">Fetch</button>
        </form>
        <p id="status" class="mt-4 text-sm text-gray-600" aria-live="polite"></p>

        <div id="result" class="hidden mt-4 space-y-6">
            <section>
                <h2 class="text-lg font-semibold mb-2">Preview</h2>
                <a id="card" target="_blank" rel="noopener noreferrer" class="block border border-gray-300 rounded-md overflow-hidden hover:bg-gray-50">
                    <img id="cardImage" alt="" class="w-full object-cover bg-gray-200 hidden" style="max-height: 320px">
                    <div class="p-3">
                        <div id="cardSite" class="text-xs uppercase text-gray-500 truncate"></div>
                        <div id="cardTitle" class="font-semibold text-gray-900"></div>
                        <div id="cardDesc" class="text-sm text-gray-600 mt-1"></div>
                    </div>
                </a>
            </section>

            <section>
                <div class="flex items-center justify-between mb-2">
                    <h2 class="text-lg font-semibold">All tags</h2>
                    <button id="copyJson" type="button" class="text-sm text-blue-600 hover:underline">Copy as JSON</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <tbody id="tagTable"></tbody>
                    </table>
                </div>
                <p id="source" class="mt-2 text-xs text-gray-500"></p>
            </section>
        </div>
    </div>
    <footer class="max-w-2xl mx-auto mt-4 text-center text-xs text-gray-500">
        <span id="version"></span>
    </footer>

    <script>
        // Bump on every change so you can confirm the live site is updated.
        const VERSION = '2.2.0';
        const UPDATED = '2026-10-28';
        document.getElementById('version').textContent = `v${VERSION} · updated ${UPDATED}`;

        // A static page can't fetch other sites directly (CORS), so we go
        // through public CORS proxies and parse the HTML ourselves. If all of
        // them fail we fall back to Microlink's free metadata API.
        // Your own proxy (see worker/README.md), e.g.
        // 'https://og-proxy.<you>.workers.dev/?url='. When set, the public
        // proxies are only used if it fails.
        const CUSTOM_PROXY = 'https://ogpreview.iniret.workers.dev/?url=';
        const PUBLIC_PROXIES = [
            url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
            url => `https://corsproxy.io/?url=${encodeURIComponent(url)}`,
            url => `https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(url)}`,
        ];
        const TIMEOUT_MS = 6000;

        const $ = id => document.getElementById(id);
        let lastData = null;

        function normalizeUrl(input) {
            let url = input.trim();
            if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
            return new URL(url).href; // throws on invalid input
        }

        async function fetchWithTimeout(url, signal) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);
            signal?.addEventListener('abort', () => controller.abort());
            try {
                const res = await fetch(url, { signal: controller.signal });
                // Keep the timeout running while the body downloads.
                return { ok: res.ok, status: res.status, text: await res.text() };
            } finally {
                clearTimeout(timer);
            }
        }

        function absolutize(value, base) {
            try { return new URL(value, base).href; } catch { return value; }
        }

        function parseMeta(html, pageUrl) {
            const doc = new DOMParser().parseFromString(html, 'text/html');
            const baseHref = doc.querySelector('base[href]')?.getAttribute('href');
            const base = baseHref ? absolutize(baseHref, pageUrl) : pageUrl;
            const tags = [];

            const title = doc.querySelector('title')?.textContent.trim();
            if (title) tags.push(['title', title]);

            for (const meta of doc.querySelectorAll('meta[content]')) {
                const key = meta.getAttribute('property') || meta.getAttribute('name') || meta.getAttribute('itemprop');
                if (!key) continue;
                const k = key.toLowerCase();
                if (!/^(og:|twitter:|article:|fb:|description$|theme-color$|author$|keywords$)/.test(k)) continue;
                let value = meta.getAttribute('content').trim();
                if (/(image|video|audio)(:url|:secure_url|:src)?$|^og:url$/.test(k)) value = absolutize(value, base);
                tags.push([k, value]);
            }

            const canonical = doc.querySelector('link[rel="canonical"][href]');
            if (canonical) tags.push(['canonical', absolutize(canonical.getAttribute('href'), base)]);
            const icon = doc.querySelector('link[rel~="icon"][href]');
            if (icon) tags.push(['icon', absolutize(icon.getAttribute('href'), base)]);

            return tags;
        }

        // Ask all proxies at once and take the first one that returns tags.
        async function raceProxies(url, proxies) {
            const controller = new AbortController();
            try {
                return await Promise.any(proxies.map(async proxy => {
                    const res = await fetchWithTimeout(proxy(url), controller.signal);
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    const tags = parseMeta(res.text, url);
                    if (!tags.length) throw new Error('no tags');
                    return { tags, source: new URL(proxy(url)).host };
                }));
            } catch {
                return null;
            } finally {
                controller.abort(); // cancel the slower requests
            }
        }

        async function fetchViaProxies(url) {
            if (CUSTOM_PROXY) {
                const own = await raceProxies(url, [u => CUSTOM_PROXY + encodeURIComponent(u)]);
                if (own) return own;
            }
            return raceProxies(url, PUBLIC_PROXIES);
        }

        async function fetchViaMicrolink(url) {
            const res = await fetchWithTimeout(`https://api.microlink.io/?url=${encodeURIComponent(url)}`);
            const json = JSON.parse(res.text);
            if (json.status !== 'success') throw new Error(json.message || 'Microlink request failed');
            const d = json.data;
            const tags = [];
            if (d.title) tags.push(['og:title', d.title]);
            if (d.description) tags.push(['og:description', d.description]);
            if (d.url) tags.push(['og:url', d.url]);
            if (d.image?.url) tags.push(['og:image', d.image.url]);
            if (d.publisher) tags.push(['og:site_name', d.publisher]);
            if (d.author) tags.push(['author', d.author]);
            if (d.date) tags.push(['article:published_time', d.date]);
            if (d.logo?.url) tags.push(['icon', d.logo.url]);
            return { tags, source: 'api.microlink.io' };
        }

        function first(tags, ...keys) {
            for (const key of keys) {
                const hit = tags.find(([k]) => k === key);
                if (hit) return hit[1];
            }
            return '';
        }

        function render(url, { tags, source }) {
            const image = first(tags, 'og:image', 'og:image:url', 'og:image:secure_url', 'twitter:image', 'twitter:image:src');
            const pageUrl = first(tags, 'og:url', 'canonical') || url;

            $('card').href = pageUrl;
            $('cardSite').textContent = first(tags, 'og:site_name') || new URL(pageUrl).hostname;
            $('cardTitle').textContent = first(tags, 'og:title', 'twitter:title', 'title') || 'No title';
            $('cardDesc').textContent = first(tags, 'og:description', 'twitter:description', 'description');
            const img = $('cardImage');
            img.classList.toggle('hidden', !image);
            if (image) {
                img.onerror = () => img.classList.add('hidden');
                img.src = image;
            } else {
                img.removeAttribute('src');
            }

            const tbody = $('tagTable');
            tbody.replaceChildren();
            for (const [key, value] of tags) {
                const tr = document.createElement('tr');
                tr.className = 'border-t border-gray-200 align-top';
                const th = document.createElement('th');
                th.className = 'text-left font-mono font-normal text-gray-500 pr-4 py-1 whitespace-nowrap';
                th.textContent = key;
                const td = document.createElement('td');
                td.className = 'py-1 break-all';
                if (/^https?:\/\//.test(value)) {
                    const a = document.createElement('a');
                    a.href = value;
                    a.target = '_blank';
                    a.rel = 'noopener noreferrer';
                    a.className = 'text-blue-600 hover:underline';
                    a.textContent = value;
                    td.appendChild(a);
                } else {
                    td.textContent = value;
                }
                tr.append(th, td);
                tbody.appendChild(tr);
            }

            $('source').textContent = `Fetched via ${source}`;
            lastData = { url, tags: Object.fromEntries(tags.map(([k, v]) => [k, v])) };
            $('result').classList.remove('hidden');
        }

        async function lookup(input) {
            let url;
            try {
                url = normalizeUrl(input);
            } catch {
                $('status').textContent = 'Please enter a valid URL.';
                return;
            }

            $('url').value = url;
            history.replaceState(null, '', `?url=${encodeURIComponent(url)}`);
            $('status').textContent = 'Loading…';
            $('result').classList.add('hidden');
            $('submitBtn').disabled = true;

            try {
                const data = await fetchViaProxies(url) || await fetchViaMicrolink(url);
                if (!data.tags.length) {
                    $('status').textContent = 'No Open Graph data found.';
                    return;
                }
                $('status').textContent = '';
                render(url, data);
            } catch (e) {
                $('status').textContent = `Couldn't fetch metadata for this URL (${e.message}). Try again later.`;
            } finally {
                $('submitBtn').disabled = false;
            }
        }

        $('urlForm').addEventListener('submit', event => {
            event.preventDefault();
            lookup($('url').value);
        });

        $('copyJson').addEventListener('click', async () => {
            if (!lastData) return;
            try {
                await navigator.clipboard.writeText(JSON.stringify(lastData, null, 2));
                $('copyJson').textContent = 'Copied!';
                setTimeout(() => { $('copyJson').textContent = 'Copy as JSON'; }, 1500);
            } catch {
                $('copyJson').textContent = 'Copy failed';
            }
        });

        // Shareable links: index.html?url=https://example.com
        const initial = new URLSearchParams(location.search).get('url');
        if (initial) lookup(initial);
    </script>
</body>
</html>
