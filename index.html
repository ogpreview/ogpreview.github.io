<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Graph Data Preview</title>
    <meta name="description" content="Preview how any link looks on Google, Facebook, X, LinkedIn, Discord, Slack and WhatsApp. Check, edit and generate Open Graph meta tags.">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js" defer></script>
    <style>
        .clamp-1, .clamp-2, .clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
        .clamp-1 { -webkit-line-clamp: 1; }
        .clamp-2 { -webkit-line-clamp: 2; }
        .clamp-3 { -webkit-line-clamp: 3; }
        .ratio-191 { aspect-ratio: 1.91 / 1; }
        .ratio-1 { aspect-ratio: 1 / 1; }
        .preview-img { width: 100%; height: 100%; object-fit: cover; display: block; background: #e5e7eb; }
    </style>
</head>
<body class="bg-gray-100 text-gray-900">
    <header class="bg-white border-b border-gray-200">
        <div class="max-w-6xl mx-auto px-4 py-4">
            <a href="/" class="text-xl font-bold">Open Graph Preview</a>
            <form id="urlForm" class="mt-3 flex flex-col sm:flex-row gap-2">
                <label for="url" class="sr-only">URL</label>
                <input type="text" id="url" name="url" placeholder="Paste a link, e.g. example.com/some-page" autocomplete="url"
                       class="flex-1 border border-gray-300 rounded-md p-2" required>
                <button type="submit" id="submitBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-md">Check website</button>
            </form>
            <p id="status" class="mt-2 text-sm text-gray-600" aria-live="polite"></p>
        </div>
    </header>

    <main id="result" class="hidden max-w-6xl mx-auto px-4 py-6">
        <div class="grid gap-6 lg:grid-cols-5">
            <!-- Left: editable metadata, checks, tags -->
            <div class="lg:col-span-2 space-y-6 min-w-0">
                <section class="bg-white rounded-md shadow p-4">
                    <div class="flex items-center justify-between mb-3">
                        <h2 class="text-lg font-semibold">Metadata</h2>
                        <button id="resetBtn" type="button" class="text-sm text-blue-600 hover:underline">Reset edits</button>
                    </div>
                    <p class="text-xs text-gray-500 mb-3">Edit the fields to see how the previews and generated tags change.</p>
                    <div id="fields" class="space-y-3"></div>
                </section>

                <section class="bg-white rounded-md shadow p-4">
                    <h2 class="text-lg font-semibold mb-3">Checks</h2>
                    <ul id="checks" class="space-y-1 text-sm"></ul>
                </section>

                <section class="bg-white rounded-md shadow p-4">
                    <div class="flex items-center justify-between mb-2">
                        <h2 class="text-lg font-semibold">All tags found</h2>
                        <button id="copyJson" type="button" class="text-sm text-blue-600 hover:underline">Copy as JSON</button>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm"><tbody id="tagTable"></tbody></table>
                    </div>
                    <p id="source" class="mt-2 text-xs text-gray-500"></p>
                </section>
            </div>

            <!-- Right: platform previews and generated code -->
            <div class="lg:col-span-3 space-y-6 min-w-0 order-first lg:order-none">
                <section id="previews">
                    <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
                        <div class="inline-flex bg-gray-200 rounded-lg p-1" role="group" aria-label="Preview size">
                            <button type="button" data-view="desktop">Desktop</button>
                            <button type="button" data-view="mobile">Mobile</button>
                        </div>
                        <button id="downloadAll" type="button" class="text-sm text-blue-600 hover:underline">Download all PNGs</button>
                    </div>
                    <div id="previewList" class="space-y-8"></div>
                </section>

                <section class="bg-white rounded-md shadow p-4">
                    <div class="flex items-center justify-between mb-2">
                        <h2 class="text-lg font-semibold">Generated meta tags</h2>
                        <button id="copyTags" type="button" class="text-sm text-blue-600 hover:underline">Copy</button>
                    </div>
                    <p class="text-xs text-gray-500 mb-2">Paste these into the &lt;head&gt; of your page.</p>
                    <pre id="metaCode" class="bg-gray-900 text-gray-100 text-xs p-3 rounded-md overflow-x-auto"></pre>
                </section>
            </div>
        </div>
    </main>

    <footer class="max-w-6xl mx-auto px-4 py-6 text-center text-xs text-gray-500">
        <span id="version"></span>
    </footer>

    <script>
        // Bump on every change so you can confirm the live site is updated.
        const VERSION = '3.1.0';
        const UPDATED = '2026-10-28';
        document.getElementById('version').textContent = `v${VERSION} · updated ${UPDATED}`;

        // A static page can't fetch other sites directly (CORS), so we go
        // through our own Worker proxy (see worker/README.md), then public
        // CORS proxies, and parse the HTML ourselves. If all of them fail we
        // fall back to Microlink's free metadata API.
        const CUSTOM_PROXY = 'https://ogpreview.iniret.workers.dev/?url=';
        const PUBLIC_PROXIES = [
            url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
            url => `https://corsproxy.io/?url=${encodeURIComponent(url)}`,
            url => `https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(url)}`,
        ];
        const TIMEOUT_MS = 6000;

        const $ = id => document.getElementById(id);

        // ---------- Fetching ----------

        function normalizeUrl(input) {
            let url = input.trim();
            if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
            return new URL(url).href; // throws on invalid input
        }

        async function fetchWithTimeout(url, signal) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);
            signal?.addEventListener('abort', () => controller.abort());
            try {
                const res = await fetch(url, { signal: controller.signal });
                // Keep the timeout running while the body downloads.
                return { ok: res.ok, status: res.status, text: await res.text() };
            } finally {
                clearTimeout(timer);
            }
        }

        function absolutize(value, base) {
            try { return new URL(value, base).href; } catch { return value; }
        }

        function parseMeta(html, pageUrl) {
            const doc = new DOMParser().parseFromString(html, 'text/html');
            const baseHref = doc.querySelector('base[href]')?.getAttribute('href');
            const base = baseHref ? absolutize(baseHref, pageUrl) : pageUrl;
            const tags = [];

            const title = doc.querySelector('title')?.textContent.trim();
            if (title) tags.push(['title', title]);

            for (const meta of doc.querySelectorAll('meta[content]')) {
                const key = meta.getAttribute('property') || meta.getAttribute('name') || meta.getAttribute('itemprop');
                if (!key) continue;
                const k = key.toLowerCase();
                if (!/^(og:|twitter:|article:|fb:|description$|theme-color$|author$|keywords$)/.test(k)) continue;
                let value = meta.getAttribute('content').trim();
                if (/(image|video|audio)(:url|:secure_url|:src)?$|^og:url$/.test(k)) value = absolutize(value, base);
                tags.push([k, value]);
            }

            const canonical = doc.querySelector('link[rel="canonical"][href]');
            if (canonical) tags.push(['canonical', absolutize(canonical.getAttribute('href'), base)]);
            const icon = doc.querySelector('link[rel~="icon"][href]');
            if (icon) tags.push(['icon', absolutize(icon.getAttribute('href'), base)]);

            return tags;
        }

        // Ask all proxies at once and take the first one that returns tags.
        async function raceProxies(url, proxies) {
            const controller = new AbortController();
            try {
                return await Promise.any(proxies.map(async proxy => {
                    const res = await fetchWithTimeout(proxy(url), controller.signal);
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    const tags = parseMeta(res.text, url);
                    if (!tags.length) throw new Error('no tags');
                    return { tags, source: new URL(proxy(url)).host };
                }));
            } catch {
                return null;
            } finally {
                controller.abort(); // cancel the slower requests
            }
        }

        async function fetchViaProxies(url) {
            if (CUSTOM_PROXY) {
                const own = await raceProxies(url, [u => CUSTOM_PROXY + encodeURIComponent(u)]);
                if (own) return own;
            }
            return raceProxies(url, PUBLIC_PROXIES);
        }

        async function fetchViaMicrolink(url) {
            const res = await fetchWithTimeout(`https://api.microlink.io/?url=${encodeURIComponent(url)}`);
            const json = JSON.parse(res.text);
            if (json.status !== 'success') throw new Error(json.message || 'Microlink request failed');
            const d = json.data;
            const tags = [];
            if (d.title) tags.push(['og:title', d.title]);
            if (d.description) tags.push(['og:description', d.description]);
            if (d.url) tags.push(['og:url', d.url]);
            if (d.image?.url) tags.push(['og:image', d.image.url]);
            if (d.publisher) tags.push(['og:site_name', d.publisher]);
            if (d.author) tags.push(['author', d.author]);
            if (d.date) tags.push(['article:published_time', d.date]);
            if (d.logo?.url) tags.push(['icon', d.logo.url]);
            return { tags, source: 'api.microlink.io' };
        }

        // ---------- State ----------

        let pageUrl = '';
        let found = null;    // { tags, source } as fetched
        let original = {};   // metadata derived from the fetched tags
        let meta = {};       // current (possibly edited) metadata

        const FIELDS = [
            { key: 'title', label: 'Title', max: 60 },
            { key: 'description', label: 'Description', max: 160, multiline: true },
            { key: 'image', label: 'Image URL' },
            { key: 'url', label: 'Page URL' },
            { key: 'siteName', label: 'Site name' },
        ];

        function first(tags, ...keys) {
            for (const key of keys) {
                const hit = tags.find(([k]) => k === key);
                if (hit) return hit[1];
            }
            return '';
        }

        function deriveMeta(tags, url) {
            return {
                title: first(tags, 'og:title', 'twitter:title', 'title'),
                description: first(tags, 'og:description', 'twitter:description', 'description'),
                image: first(tags, 'og:image', 'og:image:url', 'og:image:secure_url', 'twitter:image', 'twitter:image:src'),
                url: first(tags, 'og:url', 'canonical') || url,
                siteName: first(tags, 'og:site_name'),
                type: first(tags, 'og:type') || 'website',
                twitterCard: first(tags, 'twitter:card') || 'summary_large_image',
                twitterSite: first(tags, 'twitter:site'),
                themeColor: first(tags, 'theme-color'),
                icon: first(tags, 'icon'),
            };
        }

        function hostOf(url) {
            try { return new URL(url).hostname.replace(/^www\./, ''); } catch { return ''; }
        }

        function safeHref(url) {
            return /^https?:\/\//i.test(url) ? url : '#';
        }

        // ---------- Rendering helpers ----------

        // h('div', {class: 'x'}, 'text', child) — text is always set as text, never HTML.
        function h(tag, attrs = {}, ...children) {
            const el = document.createElement(tag);
            for (const [k, v] of Object.entries(attrs)) {
                if (v == null || v === false) continue;
                if (k === 'class') el.className = v;
                else if (k === 'style') el.style.cssText = v;
                else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
                else el.setAttribute(k, v);
            }
            for (const c of children.flat()) {
                if (c == null || c === false || c === '') continue;
                el.append(c instanceof Node ? c : document.createTextNode(String(c)));
            }
            return el;
        }

        function img(src, cls = '') {
            if (!src) return h('div', { class: `preview-img flex items-center justify-center text-gray-400 text-xs ${cls}` }, 'No image');
            const el = h('img', { class: `preview-img ${cls}`, alt: '', loading: 'lazy', referrerpolicy: 'no-referrer' });
            el.onerror = () => el.replaceWith(img('', cls));
            el.src = src;
            return el;
        }

        function favicon(m, size = 16) {
            const src = m.icon || `https://www.google.com/s2/favicons?domain=${encodeURIComponent(hostOf(m.url))}&sz=64`;
            const el = h('img', { alt: '', width: size, height: size, class: 'rounded-sm', referrerpolicy: 'no-referrer' });
            el.onerror = () => { el.style.visibility = 'hidden'; };
            el.src = src;
            return el;
        }

        // ---------- Platform previews (approximations of each site's link card) ----------
        // Each platform: which tags it reads, and how its card looks on desktop
        // and on a phone. `dark` platforms get a dark phone frame.

        const PLATFORMS = [
            {
                name: 'Google', uses: ['title', 'description'],
                render: (m, mobile) => h('div', { class: `bg-white shadow p-4 ${mobile ? 'rounded-xl' : 'rounded-md'}`, style: 'font-family: arial, sans-serif' },
                    h('div', { class: 'flex items-center gap-2' },
                        h('div', { class: 'w-7 h-7 rounded-full bg-gray-100 flex items-center justify-center flex-shrink-0' }, favicon(m, 18)),
                        h('div', { class: 'leading-tight min-w-0' },
                            h('div', { class: 'text-sm clamp-1' }, m.siteName || hostOf(m.url)),
                            h('div', { class: 'text-xs text-gray-600 clamp-1' }, m.url))),
                    h('a', { href: safeHref(m.url), target: '_blank', rel: 'noopener noreferrer', class: `block mt-1 hover:underline ${mobile ? 'text-lg clamp-2' : 'text-xl clamp-1'}`, style: 'color:#1a0dab' }, m.title || 'No title'),
                    mobile
                        ? h('div', { class: 'flex gap-3 mt-1' },
                            h('div', { class: 'text-sm clamp-3 flex-1 min-w-0', style: 'color:#4d5156' }, m.description),
                            m.image && h('div', { class: 'w-20 h-20 flex-shrink-0 rounded-lg overflow-hidden' }, img(m.image)))
                        : h('div', { class: 'text-sm clamp-2', style: 'color:#4d5156' }, m.description)),
            },
            {
                name: 'Facebook', uses: ['og:title', 'og:description', 'og:image', 'og:url'],
                render: (m, mobile) => h('div', { class: 'bg-white overflow-hidden', style: 'font-family: Helvetica, Arial, sans-serif; border: 1px solid #dadde1' },
                    h('div', { class: 'ratio-191' }, img(m.image)),
                    h('div', { class: 'px-3 py-2', style: 'background:#f0f2f5; border-top: 1px solid #dadde1' },
                        h('div', { class: 'text-xs uppercase clamp-1', style: 'color:#65676b' }, hostOf(m.url)),
                        h('div', { class: 'font-semibold clamp-2', style: 'color:#050505' }, m.title),
                        !mobile && h('div', { class: 'text-sm clamp-1', style: 'color:#65676b' }, m.description))),
            },
            {
                name: 'X (Twitter)', uses: ['twitter:card', 'twitter:title', 'twitter:image', 'og:title', 'og:image'],
                render: m => m.twitterCard === 'summary'
                    ? h('div', { class: 'bg-white flex rounded-2xl overflow-hidden', style: 'border: 1px solid #cfd9de' },
                        h('div', { class: 'w-28 flex-shrink-0 ratio-1', style: 'border-right: 1px solid #cfd9de' }, img(m.image)),
                        h('div', { class: 'p-3 text-sm min-w-0 flex flex-col justify-center' },
                            h('div', { class: 'clamp-1', style: 'color:#536471' }, hostOf(m.url)),
                            h('div', { class: 'clamp-1', style: 'color:#0f1419' }, m.title),
                            h('div', { class: 'clamp-2', style: 'color:#536471' }, m.description)))
                    : h('div', { class: 'bg-white' },
                        h('div', { class: 'relative rounded-2xl overflow-hidden ratio-191', style: 'border: 1px solid #cfd9de' },
                            img(m.image),
                            h('div', { class: 'absolute bottom-0 left-0 m-3 px-1 rounded text-xs text-white clamp-1', style: 'background: rgba(0,0,0,.77); max-width: 90%' }, m.title)),
                        h('div', { class: 'text-xs mt-1', style: 'color:#536471' }, `From ${hostOf(m.url)}`)),
            },
            {
                name: 'LinkedIn', uses: ['og:title', 'og:image', 'og:url'],
                render: m => h('div', { class: 'bg-white shadow overflow-hidden rounded-md' },
                    h('div', { class: 'ratio-191' }, img(m.image)),
                    h('div', { class: 'px-3 py-2', style: 'background:#eef3f8' },
                        h('div', { class: 'text-sm font-semibold clamp-2', style: 'color:rgba(0,0,0,.9)' }, m.title),
                        h('div', { class: 'text-xs clamp-1', style: 'color:rgba(0,0,0,.6)' }, hostOf(m.url)))),
            },
            {
                name: 'Discord', uses: ['og:site_name', 'og:title', 'og:description', 'og:image', 'theme-color'], dark: true,
                render: m => h('div', { class: 'p-4 rounded-md', style: 'background:#313338' },
                    h('div', { class: 'rounded p-3 max-w-md', style: `background:#2b2d31; border-left: 4px solid ${/^#[0-9a-f]{3,8}$/i.test(m.themeColor) ? m.themeColor : '#1e1f22'}` },
                        m.siteName && h('div', { class: 'text-xs mb-1', style: 'color:#dbdee1' }, m.siteName),
                        h('a', { href: safeHref(m.url), target: '_blank', rel: 'noopener noreferrer', class: 'font-semibold hover:underline clamp-2', style: 'color:#00a8fc' }, m.title),
                        h('div', { class: 'text-sm mt-1 clamp-3', style: 'color:#dbdee1' }, m.description),
                        m.image && h('div', { class: 'mt-3 rounded overflow-hidden ratio-191' }, img(m.image)))),
            },
            {
                name: 'Slack', uses: ['og:site_name', 'og:title', 'og:description', 'og:image'],
                render: m => h('div', { class: 'bg-white rounded-md shadow p-4' },
                    h('div', { class: 'pl-3', style: 'border-left: 4px solid #dddddd' },
                        h('div', { class: 'flex items-center gap-1 text-sm font-bold' }, favicon(m, 16), m.siteName || hostOf(m.url)),
                        h('a', { href: safeHref(m.url), target: '_blank', rel: 'noopener noreferrer', class: 'font-bold hover:underline clamp-2', style: 'color:#1264a3' }, m.title),
                        h('div', { class: 'text-sm clamp-3', style: 'color:#1d1c1d' }, m.description),
                        m.image && h('div', { class: 'mt-2 rounded overflow-hidden ratio-191', style: 'max-width: 360px' }, img(m.image)))),
            },
            {
                name: 'WhatsApp', uses: ['og:title', 'og:description', 'og:image'],
                render: m => h('div', { class: 'p-4 rounded-md', style: 'background:#efeae2' },
                    h('div', { class: 'rounded-lg p-1 max-w-sm ml-auto', style: 'background:#d9fdd3' },
                        h('div', { class: 'rounded-md overflow-hidden', style: 'background:#d1f4cc' },
                            m.image && h('div', { class: 'ratio-191' }, img(m.image)),
                            h('div', { class: 'p-2' },
                                h('div', { class: 'text-sm font-semibold clamp-2' }, m.title),
                                h('div', { class: 'text-xs text-gray-600 clamp-2' }, m.description),
                                h('div', { class: 'text-xs text-gray-500 mt-1' }, hostOf(m.url)))),
                        h('div', { class: 'text-sm px-1 pt-1 break-all', style: 'color:#027eb5' }, m.url))),
            },
        ];

        let viewMode = 'desktop'; // or 'mobile'

        function phoneFrame(platform, body) {
            const fg = platform.dark ? '#f2f3f5' : '#111827';
            return h('div', { style: `width: 375px; max-width: 100%; border: 10px solid #111827; border-radius: 36px; overflow: hidden; background: ${platform.dark ? '#313338' : '#f9fafb'}` },
                h('div', { class: 'flex justify-between px-5 pt-2 pb-1 text-xs font-semibold', style: `color:${fg}` }, h('span', {}, '9:41'), h('span', {}, '5G ▮▮▮')),
                h('div', { class: 'px-4 py-2 text-sm font-semibold', style: `color:${fg}; border-bottom: 1px solid ${platform.dark ? '#1e1f22' : '#e5e7eb'}` }, platform.name),
                h('div', { class: 'p-3' }, body));
        }

        // Tags this platform reads, green if the page has them, red if it doesn't.
        function usesLine(platform) {
            const tags = found?.tags || [];
            return h('div', { class: 'flex flex-wrap items-center gap-1 mt-2 text-xs' },
                h('span', { class: 'text-gray-500 mr-1' }, 'Reads:'),
                platform.uses.map(k => {
                    const present = tags.some(([key]) => key === k);
                    return h('span', {
                        class: `font-mono px-1 rounded ${present ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`,
                        title: present ? 'Found on the page' : 'Missing on the page; a fallback is used',
                    }, k);
                }));
        }

        function previewCard(platform) {
            const mobile = viewMode === 'mobile';
            const body = platform.render(meta, mobile);
            const target = mobile ? phoneFrame(platform, body) : body;
            const button = h('button', { type: 'button', class: 'text-xs text-blue-600 hover:underline' }, 'Download PNG');
            button.addEventListener('click', () => exportPng(platform, target, button));
            return h('div', { style: `max-width: ${mobile ? 375 : 520}px` },
                h('div', { class: 'flex items-center justify-between mb-2' },
                    h('h3', { class: 'text-sm font-semibold text-gray-600' }, platform.name),
                    button),
                target,
                usesLine(platform));
        }

        // ---------- PNG export ----------
        // The preview is drawn to a canvas with html-to-image. Images from other
        // sites only work on a canvas if they allow CORS, so we fetch them
        // ourselves (directly, then via our Worker, then a public proxy) and
        // swap in data: URLs before drawing.

        const PLACEHOLDER = 'data:image/gif;base64,R0lGODlhAQABAIAAAOXn6wAAACH5BAAAAAAALAAAAAABAAEAAAICRAEAOw==';
        const imageCache = new Map();

        function blobToDataUrl(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
        }

        async function imageToDataUrl(src) {
            if (!src || src.startsWith('data:')) return src;
            if (imageCache.has(src)) return imageCache.get(src);
            const attempts = [
                src,
                CUSTOM_PROXY && CUSTOM_PROXY + encodeURIComponent(src),
                `https://corsproxy.io/?url=${encodeURIComponent(src)}`,
            ].filter(Boolean);
            let result = null;
            for (const url of attempts) {
                try {
                    const res = await fetch(url, { signal: AbortSignal.timeout(TIMEOUT_MS) });
                    if (!res.ok) continue;
                    const blob = await res.blob();
                    if (!blob.type.startsWith('image/')) continue;
                    result = await blobToDataUrl(blob);
                    break;
                } catch {
                    // try the next way
                }
            }
            imageCache.set(src, result);
            return result;
        }

        async function inlineImages(node) {
            await Promise.all([...node.querySelectorAll('img')].map(async el => {
                const data = await imageToDataUrl(el.getAttribute('src'));
                if (!data || data === el.getAttribute('src')) return;
                el.loading = 'eager';
                el.src = data;
                await el.decode().catch(() => {});
            }));
        }

        function slug(s) {
            return s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
        }

        async function exportPng(platform, node, button) {
            const label = button.textContent;
            button.textContent = 'Rendering…';
            button.disabled = true;
            try {
                await inlineImages(node);
                const dataUrl = await htmlToImage.toPng(node, { pixelRatio: 2, skipFonts: true, imagePlaceholder: PLACEHOLDER });
                const a = h('a', { href: dataUrl, download: `${slug(hostOf(meta.url) || 'preview')}-${slug(platform.name)}-${viewMode}.png` });
                document.body.append(a);
                a.click();
                a.remove();
                button.textContent = label;
            } catch (e) {
                console.error(e);
                button.textContent = 'Export failed';
                setTimeout(() => { button.textContent = label; }, 2000);
            } finally {
                button.disabled = false;
            }
        }

        // ---------- Sections ----------

        function renderFields() {
            const box = $('fields');
            box.replaceChildren();
            for (const f of FIELDS) {
                const id = `field-${f.key}`;
                const counter = h('span', { class: 'text-xs text-gray-400' });
                const input = h(f.multiline ? 'textarea' : 'input', {
                    id, rows: f.multiline ? 3 : null,
                    class: 'mt-1 block w-full border border-gray-300 rounded-md p-2 text-sm',
                });
                input.value = meta[f.key] || '';
                const updateCounter = () => {
                    if (!f.max) return;
                    const n = input.value.length;
                    counter.textContent = `${n}/${f.max}`;
                    counter.className = `text-xs ${n > f.max ? 'text-red-600' : 'text-gray-400'}`;
                };
                input.addEventListener('input', () => {
                    meta[f.key] = input.value;
                    updateCounter();
                    renderLive();
                });
                updateCounter();
                box.append(h('div', {},
                    h('div', { class: 'flex justify-between items-baseline' },
                        h('label', { for: id, class: 'text-sm font-medium text-gray-700' }, f.label), counter),
                    input));
            }
        }

        function renderPreviews() {
            $('previewList').replaceChildren(...PLATFORMS.map(previewCard));
            for (const btn of document.querySelectorAll('[data-view]')) {
                const active = btn.dataset.view === viewMode;
                btn.className = `px-3 py-1 text-sm rounded-md ${active ? 'bg-white shadow font-semibold' : 'text-gray-600'}`;
                btn.setAttribute('aria-pressed', active);
            }
        }

        function escapeAttr(s) {
            return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function metaTagsCode() {
            const m = meta;
            const lines = ['<!-- Primary meta tags -->'];
            if (m.title) lines.push(`<title>${escapeAttr(m.title)}</title>`);
            if (m.description) lines.push(`<meta name="description" content="${escapeAttr(m.description)}">`);
            lines.push('', '<!-- Open Graph / Facebook -->');
            lines.push(`<meta property="og:type" content="${escapeAttr(m.type || 'website')}">`);
            for (const [prop, val] of [['og:url', m.url], ['og:title', m.title], ['og:description', m.description], ['og:image', m.image], ['og:site_name', m.siteName]]) {
                if (val) lines.push(`<meta property="${prop}" content="${escapeAttr(val)}">`);
            }
            lines.push('', '<!-- X (Twitter) -->');
            lines.push(`<meta name="twitter:card" content="${escapeAttr(m.twitterCard || 'summary_large_image')}">`);
            for (const [name, val] of [['twitter:site', m.twitterSite], ['twitter:title', m.title], ['twitter:description', m.description], ['twitter:image', m.image]]) {
                if (val) lines.push(`<meta name="${name}" content="${escapeAttr(val)}">`);
            }
            return lines.join('\n');
        }

        let imageSize = null; // { w, h } of the current image once loaded
        let imageSizeFor = '';

        function checkImageSize() {
            const src = meta.image;
            if (src === imageSizeFor) return;
            imageSizeFor = src;
            imageSize = null;
            if (!src) return;
            const probe = new Image();
            probe.referrerPolicy = 'no-referrer';
            probe.onload = () => { if (imageSizeFor === src) { imageSize = { w: probe.naturalWidth, h: probe.naturalHeight }; renderChecks(); } };
            probe.onerror = () => { if (imageSizeFor === src) { imageSize = { error: true }; renderChecks(); } };
            probe.src = src;
        }

        function renderChecks() {
            const m = meta;
            const tags = found?.tags || [];
            const has = k => tags.some(([key]) => key === k);
            const items = [];
            const ok = t => items.push(['ok', t]);
            const warn = t => items.push(['warn', t]);
            const bad = t => items.push(['bad', t]);

            if (!m.title) bad('Missing title.');
            else if (m.title.length > 60) warn(`Title is ${m.title.length} characters; keep it under 60 so it isn't cut off.`);
            else ok(`Title length is good (${m.title.length}).`);

            if (!m.description) bad('Missing description.');
            else if (m.description.length > 160) warn(`Description is ${m.description.length} characters; keep it under 160.`);
            else if (m.description.length < 50) warn(`Description is short (${m.description.length}); aim for 50–160 characters.`);
            else ok(`Description length is good (${m.description.length}).`);

            if (!m.image) bad('Missing og:image. Most platforms will show no picture.');
            else if (!imageSize) ok('og:image is set (checking size…).');
            else if (imageSize.error) bad("og:image couldn't be loaded.");
            else if (imageSize.w < 1200 || imageSize.h < 630) warn(`og:image is ${imageSize.w}×${imageSize.h}; 1200×630 or larger is recommended.`);
            else ok(`og:image is ${imageSize.w}×${imageSize.h}.`);

            for (const k of ['og:title', 'og:description', 'og:image', 'og:url', 'twitter:card']) {
                if (!has(k)) warn(`The page has no ${k} tag${k === 'twitter:card' ? '' : ' (using a fallback)'}.`);
            }

            const icons = { ok: ['✓', 'text-green-600'], warn: ['!', 'text-yellow-600'], bad: ['✕', 'text-red-600'] };
            $('checks').replaceChildren(...items.map(([level, text]) =>
                h('li', { class: 'flex gap-2' },
                    h('span', { class: `font-bold w-4 flex-shrink-0 ${icons[level][1]}` }, icons[level][0]),
                    h('span', {}, text))));
        }

        function renderTagTable() {
            const rows = found.tags.map(([key, value]) => h('tr', { class: 'border-t border-gray-200 align-top' },
                h('th', { class: 'text-left font-mono font-normal text-gray-500 pr-4 py-1 whitespace-nowrap' }, key),
                h('td', { class: 'py-1 break-all' },
                    /^https?:\/\//.test(value)
                        ? h('a', { href: value, target: '_blank', rel: 'noopener noreferrer', class: 'text-blue-600 hover:underline' }, value)
                        : value)));
            $('tagTable').replaceChildren(...rows);
            $('source').textContent = `Fetched via ${found.source}`;
        }

        function renderLive() {
            renderPreviews();
            $('metaCode').textContent = metaTagsCode();
            checkImageSize();
            renderChecks();
        }

        function renderAll() {
            renderFields();
            renderTagTable();
            renderLive();
            $('result').classList.remove('hidden');
        }

        // ---------- Routing: /url/<encoded> (like opengraph.xyz) and ?url= ----------

        function initialUrl() {
            const q = new URLSearchParams(location.search).get('url');
            if (q) return q;
            const m = location.pathname.match(/\/url\/(.+)$/);
            if (!m) return null;
            try { return decodeURIComponent(m[1]); } catch { return m[1]; }
        }

        function setRoute(url) {
            try {
                history.replaceState(null, '', `/url/${encodeURIComponent(url)}`);
            } catch {
                // e.g. file:// pages can't change their path
            }
            document.title = `${hostOf(url)} · Open Graph Preview`;
        }

        // ---------- Main ----------

        async function lookup(input) {
            let url;
            try {
                url = normalizeUrl(input);
            } catch {
                $('status').textContent = 'Please enter a valid URL.';
                return;
            }

            $('url').value = url;
            setRoute(url);
            $('status').textContent = 'Loading…';
            $('result').classList.add('hidden');
            $('submitBtn').disabled = true;

            try {
                const data = await fetchViaProxies(url) || await fetchViaMicrolink(url);
                if (!data.tags.length) {
                    $('status').textContent = 'No Open Graph data found.';
                    return;
                }
                $('status').textContent = '';
                pageUrl = url;
                found = data;
                original = deriveMeta(data.tags, url);
                meta = { ...original };
                renderAll();
            } catch (e) {
                $('status').textContent = `Couldn't fetch metadata for this URL (${e.message}). Try again later.`;
            } finally {
                $('submitBtn').disabled = false;
            }
        }

        $('urlForm').addEventListener('submit', event => {
            event.preventDefault();
            lookup($('url').value);
        });

        for (const btn of document.querySelectorAll('[data-view]')) {
            btn.addEventListener('click', () => {
                viewMode = btn.dataset.view;
                renderPreviews();
            });
        }

        $('downloadAll').addEventListener('click', async () => {
            const buttons = [...$('previewList').querySelectorAll('button')];
            for (const b of buttons) {
                b.click();
                await new Promise(r => setTimeout(r, 400));
                while (b.disabled) await new Promise(r => setTimeout(r, 100));
            }
        });

        $('resetBtn').addEventListener('click', () => {
            meta = { ...original };
            renderFields();
            renderLive();
        });

        async function copyText(button, text, label) {
            try {
                await navigator.clipboard.writeText(text);
                button.textContent = 'Copied!';
            } catch {
                button.textContent = 'Copy failed';
            }
            setTimeout(() => { button.textContent = label; }, 1500);
        }

        $('copyJson').addEventListener('click', () => {
            if (!found) return;
            const data = { url: pageUrl, tags: Object.fromEntries(found.tags) };
            copyText($('copyJson'), JSON.stringify(data, null, 2), 'Copy as JSON');
        });

        $('copyTags').addEventListener('click', () => copyText($('copyTags'), metaTagsCode(), 'Copy'));

        const start = initialUrl();
        if (start) lookup(start);
    </script>
</body>
</html>
