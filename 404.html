<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>og/preview</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <script>
        // GitHub Pages has no server-side routing, so links like
        // /url/https%3A%2F%2Fexample.com%2F land here. Hand them to the app.
        (function () {
            var m = location.pathname.match(/^\/url\/(.+)$/);
            if (!m) return;
            // Unencoded links (/url/https://x.com/a?b=c) put part of the
            // target in the query string, so keep it.
            var raw = m[1] + location.search;
            var target;
            try { target = decodeURIComponent(raw); } catch (e) { target = raw; }
            location.replace('/?url=' + encodeURIComponent(target) + location.hash);
        })();
    </script>
    <style>
        body { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; background: #fafaf9; color: #0a0a0a; text-align: center; padding: 4rem 1rem; }
        h1 { font-size: 11px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: #57534e; }
        a { color: #0a0a0a; text-decoration-color: #d4d4d4; text-underline-offset: 4px; }
        a:hover { text-decoration-color: #0a0a0a; }
    </style>
</head>
<body>
    <h1>Page not found</h1>
    <p><a href="/">Go to og/preview</a></p>
</body>
</html>
